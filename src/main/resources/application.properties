spring.application.name=uas-spring-ai

# Konfigurasi Camunda BPM
camunda.bpm.admin-user.id=demo
camunda.bpm.admin-user.password=demo
camunda.bpm.admin-user.firstName=Demo
camunda.bpm.generic-properties.properties.historyTimeToLive=P180D
camunda.bpm.database.schema-update=true

# Konfigurasi MySQL Lokal
spring.datasource.url=jdbc:mysql://localhost:3306/db_order_ai
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Konfigurasi Spring AI (Groq API)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
# Model yang tersedia di akun Groq saat ini: openai/gpt-oss-20b, qwen/qwen3.8-27b, openai/gpt-oss-120b
spring.ai.openai.chat.options.model=openai/gpt-oss-20b
